openapi: 3.1.0
info:
  title: Analisador de Regras Institucionais API
  version: 1.0.0
  description: API efêmera para validar, extrair e analisar um documento institucional.
servers:
  - url: /api
paths:
  /documents/analyze:
    post:
      operationId: analyzeDocument
      summary: Analisa um documento institucional
      description: |
        Recebe um único PDF, DOCX ou TXT. O arquivo e o texto extraído não são
        persistidos. A operação é cancelada após 120 segundos.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
            encoding:
              file:
                contentType: application/pdf, application/vnd.openxmlformats-officedocument.wordprocessingml.document, text/plain
      responses:
        "200":
          description: Análise concluída, inclusive quando nenhuma regra é encontrada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalysisResult"
              examples:
                withRules:
                  summary: Documento com uma obrigação
                  value:
                    document:
                      name: norma.txt
                      type: text/plain
                      characters: 42
                    summary:
                      totalRules: 1
                      requiresHumanReview: true
                    rules:
                      - id: R001
                        title: Entrega de relatório
                        description: O setor deve entregar o relatório mensal.
                        type: obligation
                        evidence: O setor deverá entregar o relatório mensal.
                        location:
                          page: null
                          section: Art. 5º
                        subject: O setor
                        action: Entregar o relatório mensal
                        deadline: null
                        condition: null
                        exception: null
                        confidence: high
                        requiresHumanReview: true
                withoutRules:
                  summary: Documento sem regras identificadas
                  value:
                    document:
                      name: informativo.txt
                      type: text/plain
                      characters: 20
                    summary:
                      totalRules: 0
                      requiresHumanReview: true
                    rules: []
        "400":
          description: Arquivo ausente, vazio ou de tipo inválido
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                invalidFile:
                  value:
                    error:
                      code: INVALID_FILE_TYPE
                      message: Formato de arquivo inválido.
                      requestId: req-example-400
        "413":
          description: Arquivo acima do limite vigente
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                fileTooLarge:
                  value:
                    error:
                      code: FILE_TOO_LARGE
                      message: O arquivo excede o limite permitido.
                      requestId: req-example-413
        "422":
          description: Documento sem texto legível
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                unreadable:
                  value:
                    error:
                      code: DOCUMENT_UNREADABLE
                      message: Não foi possível ler o documento.
                      requestId: req-example-422
        "429":
          description: Limite de requisições excedido
          headers:
            Retry-After:
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                rateLimited:
                  value:
                    error:
                      code: RATE_LIMITED
                      message: Muitas solicitações. Tente novamente mais tarde.
                      requestId: req-example-429
        "502":
          description: Resposta inválida do serviço de análise
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                invalidAiResponse:
                  value:
                    error:
                      code: AI_INVALID_RESPONSE
                      message: O serviço retornou uma resposta inválida.
                      requestId: req-example-502
        "503":
          description: Serviço de análise temporariamente indisponível
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                aiUnavailable:
                  value:
                    error:
                      code: AI_UNAVAILABLE
                      message: O serviço de análise está temporariamente indisponível.
                      requestId: req-example-503
        "504":
          description: Serviço de análise excedeu 120 segundos
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                aiTimeout:
                  value:
                    error:
                      code: AI_TIMEOUT
                      message: A análise excedeu o tempo limite.
                      requestId: req-example-504
        "500":
          description: Falha interna não classificada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                internal:
                  value:
                    error:
                      code: INTERNAL_ERROR
                      message: Ocorreu um erro interno.
                      requestId: req-example-500
components:
  schemas:
    AnalysisResult:
      type: object
      additionalProperties: false
      required: [document, summary, rules]
      properties:
        document:
          $ref: "#/components/schemas/DocumentMetadata"
        summary:
          $ref: "#/components/schemas/AnalysisSummary"
        rules:
          type: array
          items:
            $ref: "#/components/schemas/Rule"
    DocumentMetadata:
      type: object
      additionalProperties: false
      required: [name, type, characters]
      properties:
        name:
          type: string
          minLength: 1
        type:
          type: string
          minLength: 1
        characters:
          type: integer
          minimum: 0
    AnalysisSummary:
      type: object
      additionalProperties: false
      required: [totalRules, requiresHumanReview]
      properties:
        totalRules:
          type: integer
          minimum: 0
        requiresHumanReview:
          type: boolean
    Rule:
      type: object
      additionalProperties: false
      required:
        - id
        - title
        - description
        - type
        - evidence
        - location
        - subject
        - action
        - deadline
        - condition
        - exception
        - confidence
        - requiresHumanReview
      properties:
        id:
          type: string
          pattern: "^R[0-9]{3,}$"
        title:
          type: string
          minLength: 1
        description:
          type: string
          minLength: 1
        type:
          type: string
          enum:
            - obligation
            - prohibition
            - permission
            - deadline
            - condition
            - exception
            - procedure
            - definition
            - penalty
        evidence:
          type: string
          minLength: 1
        location:
          $ref: "#/components/schemas/RuleLocation"
        subject:
          type: [string, "null"]
          minLength: 1
        action:
          type: [string, "null"]
          minLength: 1
        deadline:
          type: [string, "null"]
          minLength: 1
        condition:
          type: [string, "null"]
          minLength: 1
        exception:
          type: [string, "null"]
          minLength: 1
        confidence:
          type: string
          enum: [high, medium, low]
        requiresHumanReview:
          type: boolean
    RuleLocation:
      type: object
      additionalProperties: false
      required: [page, section]
      properties:
        page:
          type: [integer, "null"]
          minimum: 1
        section:
          type: [string, "null"]
          minLength: 1
    ErrorResponse:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message, requestId]
          properties:
            code:
              type: string
              enum:
                - FILE_REQUIRED
                - INVALID_FILE_TYPE
                - FILE_TOO_LARGE
                - EMPTY_FILE
                - DOCUMENT_UNREADABLE
                - RATE_LIMITED
                - AI_INVALID_RESPONSE
                - AI_UNAVAILABLE
                - AI_TIMEOUT
                - INTERNAL_ERROR
            message:
              type: string
              minLength: 1
            requestId:
              type: string
              minLength: 1
