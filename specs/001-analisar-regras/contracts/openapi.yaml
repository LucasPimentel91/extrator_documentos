openapi: 3.1.0
info:
  title: Analisador de Regras Institucionais API
  version: 1.0.0
  description: API efêmera para validar, extrair e analisar um documento institucional.
servers:
  - url: /api
paths:
  /documents/analyze:
    post:
      operationId: analyzeDocument
      summary: Analisa um documento institucional
      description: |
        Recebe um único PDF, DOCX ou TXT. O arquivo e o texto extraído não são
        persistidos. A operação é cancelada após 120 segundos.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
            encoding:
              file:
                contentType: application/pdf, application/vnd.openxmlformats-officedocument.wordprocessingml.document, text/plain
      responses:
        "200":
          description: Análise concluída, inclusive quando nenhuma regra é encontrada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalysisResult"
        "400":
          description: Arquivo ausente, vazio ou de tipo inválido
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "413":
          description: Arquivo acima do limite vigente
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Documento sem texto legível
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Limite de requisições excedido
          headers:
            Retry-After:
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: Resposta inválida do serviço de análise
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Serviço de análise temporariamente indisponível
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "504":
          description: Serviço de análise excedeu 120 segundos
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Falha interna não classificada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  schemas:
    AnalysisResult:
      type: object
      additionalProperties: false
      required: [document, summary, rules]
      properties:
        document:
          $ref: "#/components/schemas/DocumentMetadata"
        summary:
          $ref: "#/components/schemas/AnalysisSummary"
        rules:
          type: array
          items:
            $ref: "#/components/schemas/Rule"
    DocumentMetadata:
      type: object
      additionalProperties: false
      required: [name, type, characters]
      properties:
        name:
          type: string
          minLength: 1
        type:
          type: string
          minLength: 1
        characters:
          type: integer
          minimum: 0
    AnalysisSummary:
      type: object
      additionalProperties: false
      required: [totalRules, requiresHumanReview]
      properties:
        totalRules:
          type: integer
          minimum: 0
        requiresHumanReview:
          type: boolean
    Rule:
      type: object
      additionalProperties: false
      required:
        - id
        - title
        - description
        - type
        - evidence
        - location
        - subject
        - action
        - deadline
        - condition
        - exception
        - confidence
        - requiresHumanReview
      properties:
        id:
          type: string
          pattern: "^R[0-9]{3,}$"
        title:
          type: string
          minLength: 1
        description:
          type: string
          minLength: 1
        type:
          type: string
          enum:
            - obligation
            - prohibition
            - permission
            - deadline
            - condition
            - exception
            - procedure
            - definition
            - penalty
        evidence:
          type: string
          minLength: 1
        location:
          $ref: "#/components/schemas/RuleLocation"
        subject:
          type: [string, "null"]
          minLength: 1
        action:
          type: [string, "null"]
          minLength: 1
        deadline:
          type: [string, "null"]
          minLength: 1
        condition:
          type: [string, "null"]
          minLength: 1
        exception:
          type: [string, "null"]
          minLength: 1
        confidence:
          type: string
          enum: [high, medium, low]
        requiresHumanReview:
          type: boolean
    RuleLocation:
      type: object
      additionalProperties: false
      required: [page, section]
      properties:
        page:
          type: [integer, "null"]
          minimum: 1
        section:
          type: [string, "null"]
          minLength: 1
    ErrorResponse:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message, requestId]
          properties:
            code:
              type: string
              enum:
                - FILE_REQUIRED
                - INVALID_FILE_TYPE
                - FILE_TOO_LARGE
                - EMPTY_FILE
                - DOCUMENT_UNREADABLE
                - RATE_LIMITED
                - AI_INVALID_RESPONSE
                - AI_UNAVAILABLE
                - AI_TIMEOUT
                - INTERNAL_ERROR
            message:
              type: string
              minLength: 1
            requestId:
              type: string
              minLength: 1
